img:
  description: Sets the priority for fetches initiated by the element
  value_type: enum
  value_enum:
  - auto
  - high
  - low
  value_info: ''
  is_more_value_info_required: false
  separator: ''
  urls:
  - https://fetch.spec.whatwg.org/#concept-fetch
  - https://fetch.spec.whatwg.org/#request-priority
